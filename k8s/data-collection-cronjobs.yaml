apiVersion: batch/v1
kind: CronJob
metadata:
  name: air-quality
spec:
  schedule: '5 * * * *' # 매시 5분
  revisionHistoryLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: air-quality
              image: bs6465/savesns-script-air-quality:0c42d1edfd043c376535070753a0b8327486b6d7
              imagePullPolicy: Always

              envFrom:
                - configMapRef:
                    name: backend-config

              env:
                - name: AIR_QUALITY_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: AIR_QUALITY_API_KEY

                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: DB_PASSWORD

          restartPolicy: OnFailure
---
