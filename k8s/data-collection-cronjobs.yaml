apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-news
spec:
  schedule: '0 */2 * * *' # 2시간마다
  revisionHistoryLimit: 1
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: local-news
              image: bs6465/savesns-script-local-news:adc7944faab036c775a1bff74bdcae5db5830f59
              imagePullPolicy: Always

              envFrom:
                - configMapRef:
                    name: backend-config

              env:
                - name: NAVER_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: NAVER_CLIENT_ID
                - name: NAVER_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: NAVER_CLIENT_SECRET

                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: DB_PASSWORD

          restartPolicy: Never
