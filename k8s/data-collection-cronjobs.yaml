apiVersion: batch/v1
kind: CronJob
metadata:
  name: air-quality
spec:
  schedule: '5 */4 * * *' # 매시 5분
  revisionHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: air-quality
              image: bs6465/savesns-script-air-quality:2abb37889871894b450abc93eb65c83b0f5f22ff
              imagePullPolicy: Always

              envFrom:
                - configMapRef:
                    name: backend-config

              env:
                - name: AIR_QUALITY_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: AIR_QUALITY_API_KEY

                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: DB_PASSWORD

          restartPolicy: Never
---
