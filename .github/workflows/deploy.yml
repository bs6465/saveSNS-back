name: Build and Deploy

on:
  push:
    branches: ['main']
    paths-ignore: # k8s 폴더가 변경될 때는 이 액션을 실행하지 않음 (무한루프 방지)
      - 'k8s/**'

env:
  BACKEND_IMAGE_NAME: savesns-backend_image

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: # 같은 레포에 푸시하려면 쓰기 권한 필요
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      # 어디가 바뀌었는지 감지하는 단계
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'src/**'
              - 'package.json'
              - 'Dockerfile.backend'
            scripts:
              - 'scripts/**'
              - 'Dockerfile.scripts'

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 백엔드 빌드
      - name: Build Backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      # 각 스크립트별 독립 이미지 빌드
      - name: Build Script - weather-ultra-short-term-forecast
        if: steps.changes.outputs.scripts == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.scripts
          push: true
          build-args: SCRIPT_NAME=weather-ultra-short-term-forecast
          tags: ${{ secrets.DOCKER_USERNAME }}/savesns-script-weather-ultra:${{ github.sha }}

      - name: Build Script - weather-short-term-forecast
        if: steps.changes.outputs.scripts == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.scripts
          push: true
          build-args: SCRIPT_NAME=weather-short-term-forecast
          tags: ${{ secrets.DOCKER_USERNAME }}/savesns-script-weather-short:${{ github.sha }}

      - name: Build Script - air-quality
        if: steps.changes.outputs.scripts == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.scripts
          push: true
          build-args: SCRIPT_NAME=air-quality
          tags: ${{ secrets.DOCKER_USERNAME }}/savesns-script-air-quality:${{ github.sha }}

      - name: Build Script - disaster-alert
        if: steps.changes.outputs.scripts == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.scripts
          push: true
          build-args: SCRIPT_NAME=disaster-alert
          tags: ${{ secrets.DOCKER_USERNAME }}/savesns-script-disaster-alert:${{ github.sha }}

      - name: Build Script - traffic-incidents
        if: steps.changes.outputs.scripts == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.scripts
          push: true
          build-args: SCRIPT_NAME=traffic-incidents
          tags: ${{ secrets.DOCKER_USERNAME }}/savesns-script-traffic-incidents:${{ github.sha }}

      - name: Build Script - local-news
        if: steps.changes.outputs.scripts == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.scripts
          push: true
          build-args: SCRIPT_NAME=local-news
          tags: ${{ secrets.DOCKER_USERNAME }}/savesns-script-local-news:${{ github.sha }}

      # Kubernetes 매니페스트 업데이트
      - name: Update Kubernetes Manifest
        run: |
          # 백엔드가 빌드되었을 때만 태그 교체
          if [ "${{ steps.changes.outputs.backend }}" == "true" ]; then
            echo "Updating Backend Manifest..."
            sed -i "s|image: .*/${{ env.BACKEND_IMAGE_NAME }}:.*|image: ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}|" k8s/deployment.yaml
          fi

          # 스크립트가 빌드되었을 때만 태그 교체
          if [ "${{ steps.changes.outputs.scripts }}" == "true" ]; then
            echo "Updating Scripts Manifests..."
            DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"

            # cronjob.yaml - weather-ultra-short-term-forecast
            sed -i "s|image: .*/savesns-script-weather-ultra:.*|image: ${DOCKER_USER}/savesns-script-weather-ultra:${{ github.sha }}|" k8s/cronjob.yaml

            # weather-short-term-forecast.yaml
            sed -i "s|image: .*/savesns-script-weather-short:.*|image: ${DOCKER_USER}/savesns-script-weather-short:${{ github.sha }}|" k8s/weather-short-term-forecast.yaml

            # data-collection-cronjobs.yaml - 각 스크립트별 이미지 교체
            sed -i "s|image: .*/savesns-script-air-quality:.*|image: ${DOCKER_USER}/savesns-script-air-quality:${{ github.sha }}|" k8s/data-collection-cronjobs.yaml
            sed -i "s|image: .*/savesns-script-disaster-alert:.*|image: ${DOCKER_USER}/savesns-script-disaster-alert:${{ github.sha }}|" k8s/data-collection-cronjobs.yaml
            sed -i "s|image: .*/savesns-script-traffic-incidents:.*|image: ${DOCKER_USER}/savesns-script-traffic-incidents:${{ github.sha }}|" k8s/data-collection-cronjobs.yaml
            sed -i "s|image: .*/savesns-script-local-news:.*|image: ${DOCKER_USER}/savesns-script-local-news:${{ github.sha }}|" k8s/data-collection-cronjobs.yaml
          fi

          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # 변경사항이 있을 때만 커밋 (둘 다 안 바뀌었으면 에러 방지)
          git commit -am "Update image tags [skip ci]" || echo "No changes to commit"
          git push
